
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Catálogo UNCP{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f4;
            margin: 0;
            color: #24332c;
        }

        header {
            background-color: #145a32;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            min-height: 65vh;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .precio {
            color: #147d46;
            font-size: 24px;
            font-weight: bold;
        }

        .boton {
            display: inline-block;
            padding: 12px 20px;
            background: #167c45;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        footer {
            background: #145a32;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Catálogo de Productos Tecnológicos</h1>
        <nav>
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'catalogo' %}">Catálogo</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        &copy; 2026 - UNCP | Desarrollo Web Fullstack
    </footer>
</body>
</html>
